# Render Blueprint: managed PostgreSQL + two Docker web services.
# NOTE: free Postgres databases expire after 30 days; use a paid plan for anything long-lived.
databases:
  - name: secora-db
    databaseName: secora
    user: secora
    plan: free

services:
  - type: web
    name: secora-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secora-db
          property: connectionString
      # Must equal the frontend's public URL. If Render appended a suffix to the name, update it.
      - key: CORS_ORIGINS
        value: https://secora-frontend.onrender.com

  - type: web
    name: secora-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Must equal the backend's public URL (no trailing slash). Update if the name got a suffix.
      - key: API_BASE_URL
        value: https://secora-backend.onrender.com
