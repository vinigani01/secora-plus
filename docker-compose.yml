services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secora
      POSTGRES_PASSWORD: secora
      POSTGRES_DB: secora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secora -d secora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://secora:secora@db:5432/secora
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      PORT: "80"
      # The browser calls the backend directly, so this is the host-visible URL.
      API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
